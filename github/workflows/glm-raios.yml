name: Relâmpagos GLM (NOAA) → data/raios.json

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glm-raios
  cancel-in-progress: true

jobs:
  raios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install numpy netCDF4

      - name: Baixar GLM e gerar data/raios.json
        run: python raios/glm_pipeline.py

      - name: Publicar no repositório
        run: |
          git config user.name "raios-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raios.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza relâmpagos GLM"
            git push
          fi
          
